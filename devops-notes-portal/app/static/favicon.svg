<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Glow Shadow -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bgGrad)" filter="url(#subtleShadow)"/>
  
  <!-- Subtle Frosted Glass Reflection Highlight -->
  <path d="M4 18 C4 9.7 10.7 4 19 4 L45 4 C53.3 4 60 9.7 60 18 L60 28 C45 32 19 32 4 28 Z" fill="url(#topGlow)" />

  <!-- DevOps Infinity Loop (CI/CD Knowledge Flow) -->
  <path d="M22 23 C15 23 10 27 10 32 C10 37 15 41 22 41 C28 41 32 36.5 36 31 C40 25.5 44 23 50 23 C57 23 62 27 62 32 C62 37 57 41 50 41 C44 41 40 36.5 36 31 C32 25.5 28 23 22 23 Z" 
        fill="none" 
        stroke="url(#loopGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Core Knowledge & Deployment Pulse Dots -->
  <circle cx="21" cy="32" r="2.5" fill="#ffffff" />
  <circle cx="36" cy="31" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="51" cy="32" r="2.5" fill="#ffffff" />
</svg>
