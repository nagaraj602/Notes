{% extends "base.html" %}

{% block title %}404 - Page Not Found | DevOps Knowledge Portal{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center p-6 min-h-[70vh]">
  <div class="glass-card max-w-md w-full p-8 rounded-3xl border border-sky-200 text-center space-y-5 shadow-xl bg-white/90">
    <div class="w-16 h-16 rounded-3xl bg-amber-50 text-amber-600 flex items-center justify-center text-3xl mx-auto shadow-md shadow-amber-500/10 border border-amber-200">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    
    <div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tight font-mono">404</h1>
      <h2 class="text-base font-extrabold text-slate-800 mt-1">Page Not Found</h2>
      <p class="text-xs text-slate-500 mt-2 leading-relaxed">
        The page you are looking for doesn't exist, has been moved, or is restricted.
      </p>
    </div>

    <div class="pt-2 flex items-center justify-center gap-3">
      <a href="/" class="px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs shadow-md shadow-sky-500/20 transition-all flex items-center space-x-2">
        <i class="fa-solid fa-house text-xs"></i>
        <span>Return to Home</span>
      </a>
      <button onclick="window.history.back()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-all flex items-center space-x-1.5">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>Go Back</span>
      </button>
    </div>
  </div>
</div>
{% endblock %}
